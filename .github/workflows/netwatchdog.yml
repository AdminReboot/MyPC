# CI/CD NetWatchdog
#  - Mỗi push/PR: chạy test + build bộ cài (tải về ở mục Artifacts của lần chạy).
#  - Push tag vX.Y.Z: build + tạo GitHub Release kèm NetWatchdog-Setup-X.Y.Z.exe.
#    Ứng dụng đã cài sẽ tự thấy bản mới và cập nhật bằng 1 nút bấm.
name: NetWatchdog

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: netwatchdog
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: netwatchdog/requirements.txt

      - name: Cài thư viện
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Xác định phiên bản
        id: ver
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = "0.0.$env:GITHUB_RUN_NUMBER" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Cài Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build bộ cài
        run: ./packaging/build.ps1 -Version ${{ steps.ver.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: NetWatchdog-Setup-${{ steps.ver.outputs.version }}
          path: netwatchdog/build/installer/*.exe

      - name: Tạo GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = (Get-ChildItem build/installer/NetWatchdog-Setup-*.exe).FullName
          gh release create $env:GITHUB_REF_NAME $exe --title "NetWatchdog ${{ steps.ver.outputs.version }}" --generate-notes
